<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поддержка (агент) — {{SITE_NAME}}</title>
  <link rel="icon" type="image/svg+xml" href="/api/store/favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4f7;
      --panel: #ffffff;
      --text: #14222c;
      --muted: #60707a;
      --line: rgba(20,34,44,0.1);
      --brand: #0c8c8c;
      --brand-deep: #0d5d62;
      --accent: #ef8a25;
      --font: "Manrope","Segoe UI",sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); color: var(--text); background: var(--bg); display: flex; flex-direction: column; }

    /* ── Login screen ──────────────────────────────── */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; padding: 20px; text-align: center;
      background: linear-gradient(160deg, #f7efe3 0%, #eaf3f3 100%);
    }
    #loginScreen img.logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 20px; }
    #loginScreen h1 { font-size: 22px; font-weight: 800; color: var(--brand-deep); }
    #loginScreen p { color: var(--muted); margin: 8px 0 28px; font-size: 14px; }
    .tg-login-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    /* ── Main layout ───────────────────────────────── */
    #mainScreen { display: none; flex: 1; overflow: hidden; flex-direction: row; }

    /* sidebar */
    .sidebar {
      width: 280px; flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-header img { width: 32px; height: 32px; border-radius: 8px; }
    .sidebar-header-text { flex: 1; }
    .sidebar-header-text .site { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--brand); }
    .sidebar-header-text .agent-name { font-size: 12px; color: var(--muted); }
    .filter-row {
      display: flex; gap: 6px; padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .filter-btn {
      flex: 1; padding: 6px 4px; font-size: 11px; font-weight: 700;
      border: 1px solid var(--line); border-radius: 8px;
      background: transparent; cursor: pointer; font-family: var(--font);
      color: var(--muted); transition: all .15s;
    }
    .filter-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .ticket-list { flex: 1; overflow-y: auto; }
    .ticket-item {
      padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--line);
      transition: background .15s; position: relative;
    }
    .ticket-item:hover { background: rgba(12,140,140,0.05); }
    .ticket-item.selected { background: rgba(12,140,140,0.08); }
    .ticket-item.unread::after {
      content: ""; position: absolute; top: 14px; right: 12px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
    }
    .ti-contact { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .ti-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ti-time { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .empty-list { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; }

    /* chat panel */
    .chat-panel {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
    }
    .chat-placeholder {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
    }
    .chat-top {
      padding: 12px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px;
    }
    .chat-top h3 { font-size: 14px; font-weight: 700; }
    .chat-top .contact-info { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .client-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ccc; flex-shrink: 0; margin-left: auto;
      transition: background .3s;
    }
    .client-dot.online { background: #34c759; }
    .resolve-btn {
      padding: 7px 14px; border-radius: 10px;
      background: rgba(52,199,89,0.12); color: #1a7a3a;
      font-size: 12px; font-weight: 700; font-family: var(--font);
      border: 1px solid rgba(52,199,89,0.3); cursor: pointer;
      transition: all .15s;
    }
    .resolve-btn:hover { background: rgba(52,199,89,0.22); }
    .resolve-btn:disabled { opacity: .4; cursor: not-allowed; }

    .messages {
      flex: 1; overflow-y: auto; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 72%; padding: 10px 14px; border-radius: 18px;
      font-size: 14px; line-height: 1.5; word-break: break-word;
    }
    .msg.client {
      align-self: flex-start;
      background: rgba(20,34,44,0.07);
      border-bottom-left-radius: 4px;
    }
    .msg.agent {
      align-self: flex-end;
      background: var(--brand); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg .msg-time { font-size: 10px; opacity: .55; margin-top: 4px; }
    .msg.agent .msg-time { text-align: right; }

    .typing-indicator {
      align-self: flex-start; padding: 10px 14px;
      border-radius: 18px; border-bottom-left-radius: 4px;
      background: rgba(20,34,44,0.07); display: none;
    }
    .typing-indicator.visible { display: flex; align-items: center; gap: 4px; }
    .typing-indicator span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .resolved-banner {
      text-align: center; padding: 10px;
      background: rgba(52,199,89,0.1); color: #1a7a3a;
      font-size: 13px; font-weight: 600;
      border-top: 1px solid rgba(52,199,89,0.2);
    }

    .input-area {
      padding: 12px 14px; border-top: 1px solid var(--line);
      display: flex; align-items: flex-end; gap: 10px;
    }
    .input-area textarea {
      flex: 1; padding: 10px 14px; border: 1px solid var(--line);
      border-radius: 20px; background: var(--bg); font-family: var(--font);
      font-size: 14px; color: var(--text); outline: none; resize: none;
      max-height: 120px; overflow-y: auto; transition: border-color .2s;
    }
    .input-area textarea:focus { border-color: var(--brand); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--brand); color: #fff;
      border: none; cursor: pointer; font-size: 18px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .send-btn:hover { background: var(--brand-deep); }
    .send-btn:disabled { opacity: .45; }

    /* Mobile */
    @media(max-width: 640px) {
      .sidebar { width: 100%; position: absolute; top: 0; left: 0; bottom: 0; z-index: 10; transform: translateX(0); transition: transform .2s; }
      .sidebar.hidden { transform: translateX(-100%); }
      .chat-panel { width: 100%; }
      #mainScreen { position: relative; }
      .back-btn { display: inline-flex !important; }
    }
    .back-btn { display: none; align-items: center; gap: 6px; font-size: 13px; color: var(--brand); background: none; border: none; cursor: pointer; font-weight: 700; font-family: var(--font); }
  </style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <img class="logo" src="/api/store/logo" alt="">
  <h1>Панель поддержки</h1>
  <p>Введите пароль для входа</p>
  <div class="tg-login-wrap">
    <input type="password" id="adminPassword" placeholder="Пароль"
      style="padding:10px 16px;border:1px solid #ddd;border-radius:8px;font-size:15px;width:240px;outline:none;"
      onkeydown="if(event.key==='Enter') doPasswordLogin()">
    <button onclick="doPasswordLogin()"
      style="margin-top:8px;padding:10px 28px;background:#0c8c8c;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;width:260px;">
      Войти
    </button>
    <div id="loginError" style="color:#c0392b;font-size:13px;display:none;margin-top:6px">
      Неверный пароль или нет доступа.
    </div>
  </div>
</div>

<!-- Main -->
<div id="mainScreen">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/api/store/logo" alt="">
      <div class="sidebar-header-text">
        <div class="site">{{SITE_NAME}}</div>
        <div class="agent-name" id="agentNameLabel">—</div>
      </div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('open', this)">Открытые</button>
      <button class="filter-btn" onclick="setFilter('resolved', this)">Закрытые</button>
      <button class="filter-btn" onclick="setFilter('all', this)">Все</button>
    </div>
    <div class="ticket-list" id="ticketList">
      <div class="empty-list">Загрузка...</div>
    </div>
  </div>
  <div class="chat-panel" id="chatPanel">
    <div class="chat-placeholder" id="placeholder">
      <div>
        <div style="font-size:40px;margin-bottom:12px">💬</div>
        <div>Выберите тикет слева</div>
      </div>
    </div>
    <div id="activeChat" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-top" id="chatTop">
        <button class="back-btn" id="backBtn" onclick="showSidebar()">← Тикеты</button>
        <div>
          <div class="chat-top h3" id="chatContactLabel" style="font-size:14px;font-weight:700;"></div>
          <div class="contact-info" id="chatContactInfo"></div>
        </div>
        <div class="client-dot" id="clientDot"></div>
        <button class="resolve-btn" id="resolveBtn" onclick="resolveTicket()">✅ Обработано</button>
      </div>
      <div class="messages" id="messages">
        <div class="typing-indicator" id="typingIndicator">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="resolved-banner" id="resolvedBanner" style="display:none">✅ Тикет закрыт</div>
      <div class="input-area" id="inputArea">
        <textarea id="replyInput" rows="1" placeholder="Ответить..." onkeydown="handleKey(event)" oninput="autoResize(this); sendTyping();"></textarea>
        <button class="send-btn" onclick="sendReply()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  let agentToken = localStorage.getItem("support_agent_token");
  let currentTicketId = null;
  let ws = null;
  let ticketFilter = "open";
  let seenMessages = new Set();
  let typingTimeout = null;
  let audioCtx = null;
  let ticketWsMap = {};

  function beep(freq = 880, dur = 0.25, vol = 0.08) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  function formatTime(iso) {
    const d = new Date(iso + (iso.endsWith("Z") ? "" : "Z"));
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
      return d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
    }
    return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"}) + " " + d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
  }

  async function doPasswordLogin() {
    const pwd = document.getElementById("adminPassword").value.trim();
    if (!pwd) return;
    document.getElementById("loginError").style.display = "none";
    const r = await fetch("/api/support/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: pwd, name: "Агент"})
    });
    const data = await r.json();
    if (data.ok) {
      agentToken = data.token;
      localStorage.setItem("support_agent_token", agentToken);
      await initMain({name: "Агент"});
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }

  async function onTelegramAuth(user) {
    document.getElementById("loginError").style.display = "none";
    const r = await fetch("/api/support/admin/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(user)
    });
    const data = await r.json();
    if (data.ok) {
      agentToken = data.token;
      localStorage.setItem("support_agent_token", agentToken);
      initMain(data);
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }

  async function initMain(agentData) {
    document.getElementById("loginScreen").style.display = "none";
    const main = document.getElementById("mainScreen");
    main.style.display = "flex";
    document.getElementById("agentNameLabel").textContent = agentData.name || agentData.username || "Агент";
    await loadTickets();
    // poll every 15s for new tickets
    setInterval(loadTickets, 15000);
  }

  function agentHeaders(extra = {}) {
    return {"X-Support-Agent-Token": agentToken, ...extra};
  }

  async function tryAutoLogin() {
    if (!agentToken) return;
    const r = await fetch("/api/support/admin/me", {
      headers: agentHeaders()
    });
    if (!r.ok) { agentToken = null; localStorage.removeItem("support_agent_token"); return; }
    const data = await r.json();
    initMain(data);
  }

  async function loadTickets() {
    const r = await fetch(`/api/support/admin/tickets?status=${ticketFilter}`, {
      headers: agentHeaders()
    });
    if (!r.ok) return;
    const tickets = await r.json();
    renderTicketList(tickets);
  }

  function renderTicketList(tickets) {
    const list = document.getElementById("ticketList");
    if (!tickets.length) {
      list.innerHTML = '<div class="empty-list">Нет тикетов</div>';
      return;
    }
    list.innerHTML = tickets.map(t => {
      const unread = !seenMessages.has(t.id) && t.last_client_message;
      const contact = t.client_contact || `#${t.id}`;
      const preview = t.last_message_text ? escapeHtml(t.last_message_text).substring(0, 60) : "—";
      const time = t.last_message_at ? formatTime(t.last_message_at) : formatTime(t.created_at);
      const selected = t.id === currentTicketId ? " selected" : "";
      const unreadCls = unread ? " unread" : "";
      return `<div class="ticket-item${selected}${unreadCls}" onclick="openTicket(${t.id}, '${escapeHtml(t.token)}', '${escapeHtml(contact)}', '${escapeHtml(t.client_messenger || '')}', '${escapeHtml(t.status || 'open')}')">
        <div class="ti-contact">${escapeHtml(contact)}</div>
        <div class="ti-preview">${preview}</div>
        <div class="ti-time">${time}</div>
      </div>`;
    }).join("");
  }

  async function openTicket(id, token, contact, messenger, status) {
    currentTicketId = id;
    seenMessages.add(id);

    // Mobile: hide sidebar
    document.getElementById("sidebar").classList.add("hidden");

    document.getElementById("placeholder").style.display = "none";
    const chat = document.getElementById("activeChat");
    chat.style.display = "flex";

    document.getElementById("chatContactLabel").textContent = contact;
    document.getElementById("chatContactInfo").textContent = messenger ? `Мессенджер: ${messenger}` : "";

    const resolved = status === "resolved";
    document.getElementById("resolvedBanner").style.display = resolved ? "block" : "none";
    document.getElementById("inputArea").style.display = resolved ? "none" : "flex";
    document.getElementById("resolveBtn").disabled = resolved;

    // Clear
    const area = document.getElementById("messages");
    const typing = document.getElementById("typingIndicator");
    area.innerHTML = "";
    area.appendChild(typing);
    typing.className = "typing-indicator";

    // Load messages
    const r = await fetch(`/api/support/admin/ticket/${id}/messages`, {
      headers: agentHeaders()
    });
    const data = await r.json();
    for (const msg of (data.messages || [])) appendMessage(msg, false);

    // Close old WS
    if (ws) ws.close();

    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/support/admin/${id}?token=${agentToken}`);
    ws.onmessage = e => {
      const data = JSON.parse(e.data);
      if (data.type === "message" && data.sender === "client") {
        showTyping(false);
        appendMessage(data, true);
        beep(880, 0.2);
      } else if (data.type === "typing" && data.sender === "client") {
        showTyping(true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => showTyping(false), 3000);
      } else if (data.type === "presence" && data.who === "client") {
        const dot = document.getElementById("clientDot");
        dot.className = "client-dot" + (data.online ? " online" : "");
      } else if (data.type === "resolved") {
        document.getElementById("resolvedBanner").style.display = "block";
        document.getElementById("inputArea").style.display = "none";
        document.getElementById("resolveBtn").disabled = true;
      }
    };
    ws.onclose = () => {};

    // re-render list to update selection
    loadTickets();
  }

  function appendMessage(msg, scroll = true) {
    const area = document.getElementById("messages");
    const typing = document.getElementById("typingIndicator");
    const el = document.createElement("div");
    el.className = `msg ${msg.sender}`;
    el.innerHTML = `<div>${escapeHtml(msg.text)}</div><div class="msg-time">${formatTime(msg.created_at)}</div>`;
    area.insertBefore(el, typing);
    if (scroll) area.scrollTop = area.scrollHeight;
  }

  function showTyping(v) {
    const t = document.getElementById("typingIndicator");
    t.className = "typing-indicator" + (v ? " visible" : "");
    if (v) document.getElementById("messages").scrollTop = 9999;
  }

  async function sendReply() {
    const input = document.getElementById("replyInput");
    const text = input.value.trim();
    if (!text || !currentTicketId) return;
    input.value = ""; autoResize(input);
    appendMessage({sender:"agent", text, created_at: new Date().toISOString()}, true);
    await fetch(`/api/support/admin/ticket/${currentTicketId}/message`, {
      method: "POST",
      headers: agentHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({text})
    });
  }

  function sendTyping() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: "typing"}));
    }
  }

  async function resolveTicket() {
    if (!currentTicketId) return;
    const btn = document.getElementById("resolveBtn");
    btn.disabled = true;
    await fetch(`/api/support/admin/ticket/${currentTicketId}/resolve`, {
      method: "POST",
      headers: agentHeaders()
    });
    document.getElementById("resolvedBanner").style.display = "block";
    document.getElementById("inputArea").style.display = "none";
    loadTickets();
  }

  function setFilter(f, btn) {
    ticketFilter = f;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadTickets();
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(); }
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  function showSidebar() {
    document.getElementById("sidebar").classList.remove("hidden");
    document.getElementById("placeholder").style.display = "";
    document.getElementById("activeChat").style.display = "none";
    currentTicketId = null;
  }

  document.addEventListener("click", () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }, {once: true});

  tryAutoLogin();
</script>
</body>
</html>
