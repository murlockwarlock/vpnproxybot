<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поддержка — {{SITE_NAME}}</title>
  <link rel="icon" type="image/svg+xml" href="/api/store/favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7efe3;
      --panel: rgba(255,249,241,0.92);
      --panel-solid: #fffaf4;
      --text: #14222c;
      --muted: #60707a;
      --line: rgba(20,34,44,0.12);
      --brand: #0c8c8c;
      --brand-deep: #0d5d62;
      --accent: #ef8a25;
      --shadow: 0 8px 32px rgba(26,42,49,0.12);
      --radius-xl: 28px;
      --radius-md: 16px;
      --font: "Manrope","Segoe UI",sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(239,138,37,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(12,140,140,0.14), transparent 30%),
        linear-gradient(180deg, #fff8ef 0%, #f7f0e7 54%, #f2eadf 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 40px;
    }
    /* In iframe widget: no extra padding, chat fills the whole frame */
    body.iframe-mode {
      padding: 0;
      min-height: 100%;
      background: var(--panel-solid);
    }
    .topbar {
      width: 100%; max-width: 680px;
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    body.iframe-mode .topbar { display: none; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(20,34,44,0.06);
      text-decoration: none;
    }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    .brand-text { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-deep); }
    .topbar-title { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: auto; }

    .chat-wrap {
      width: 100%; max-width: 680px;
      display: flex; flex-direction: column;
      background: var(--panel-solid);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 520px;
      max-height: calc(100vh - 120px);
    }
    body.iframe-mode .chat-wrap {
      min-height: 0;
      max-height: 100%;
      height: 100%;
      border-radius: 0;
      box-shadow: none;
      flex: 1;
    }
    body.iframe-mode { display: flex; flex-direction: column; }
    body.iframe-mode #newTicketScreen {
      flex: 1;
      overflow-y: auto;
    }
    body.iframe-mode #chatScreen {
      flex: 1;
    }
    .chat-header {
      padding: 18px 22px 16px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px;
    }
    .chat-header-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--brand); display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .chat-header-text h2 { font-size: 15px; font-weight: 700; }
    .chat-header-text p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ccc; margin-left: auto; flex-shrink: 0;
      transition: background .3s;
    }
    .status-dot.online { background: #34c759; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 18px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px; line-height: 1.5;
      word-break: break-word;
    }
    .msg.client {
      align-self: flex-end;
      background: var(--brand);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: rgba(20,34,44,0.07);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg .msg-time {
      font-size: 10px; opacity: .55; margin-top: 4px; text-align: right;
    }
    .msg.agent .msg-time { text-align: left; }
    .msg .msg-sender { font-size: 11px; font-weight: 700; margin-bottom: 3px; opacity: .7; }

    .typing-indicator {
      align-self: flex-start;
      padding: 10px 14px;
      border-radius: 18px; border-bottom-left-radius: 4px;
      background: rgba(20,34,44,0.07);
      display: none;
    }
    .typing-indicator.visible { display: flex; align-items: center; gap: 4px; }
    .typing-indicator span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .2s; }
    .typing-indicator span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* New ticket form */
    .new-ticket-form {
      padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .new-ticket-form h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .new-ticket-form p { font-size: 13px; color: var(--muted); }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 11px 14px;
      border: 1px solid var(--line); border-radius: 12px;
      background: rgba(20,34,44,0.04); font-family: var(--font);
      font-size: 14px; color: var(--text); outline: none;
      transition: border-color .2s;
      resize: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--brand);
    }
    .btn-primary {
      padding: 13px 20px; border-radius: 14px;
      background: var(--brand); color: #fff;
      font-family: var(--font); font-size: 14px; font-weight: 700;
      border: none; cursor: pointer; transition: background .2s;
    }
    .btn-primary:hover { background: var(--brand-deep); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .support-social-links {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .support-social-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 600; text-decoration: none;
      transition: opacity .15s;
    }
    .support-social-btn:hover { opacity: .8; }
    .support-social-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .support-social-vk { background: #0077FF; color: #fff; }

    /* Input area */
    .chat-input-area {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      display: flex; align-items: flex-end; gap: 10px;
    }
    .chat-input {
      flex: 1; padding: 10px 14px;
      border: 1px solid var(--line); border-radius: 20px;
      background: rgba(20,34,44,0.04); font-family: var(--font);
      font-size: 14px; color: var(--text); outline: none; resize: none;
      max-height: 120px; overflow-y: auto;
      transition: border-color .2s;
    }
    .chat-input:focus { border-color: var(--brand); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--brand); color: #fff;
      border: none; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .2s;
    }
    .send-btn:hover { background: var(--brand-deep); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; }

    .resolved-banner {
      text-align: center; padding: 14px;
      background: rgba(52,199,89,0.1); color: #1a7a3a;
      font-size: 13px; font-weight: 600;
      border-top: 1px solid rgba(52,199,89,0.2);
    }
    .resolved-actions {
      display: none;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--panel-solid);
    }
    .resolved-actions .btn-primary {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">
      <img src="/api/store/logo" alt="">
      <span class="brand-text">{{SITE_NAME}}</span>
    </a>
    <span class="topbar-title">Поддержка</span>
  </div>

  <div class="chat-wrap" id="chatWrap">
    <!-- new ticket form (shown initially) -->
    <div id="newTicketScreen" class="new-ticket-form">
      <div>
        <h3>Написать в поддержку</h3>
        <p>Опишите проблему — мы ответим как можно скорее.</p>
      </div>
      <div class="field">
        <label>Ваш вопрос *</label>
        <textarea id="firstMsg" rows="3" placeholder="Например: ключ не работает после оплаты..."></textarea>
      </div>
      <div class="field">
        <label>Как с вами связаться *</label>
        <input id="contactInput" type="text" placeholder="Телефон или email..." required>
      </div>
      <div class="field">
        <label>Предпочтительный мессенджер</label>
        <select id="messengerInput">
          <option value="">— не указано —</option>
          <option value="vk">ВКонтакте</option>
          <option value="phone">Телефон / SMS</option>
          <option value="email">Email</option>
          <option value="other">Другой</option>
        </select>
      </div>
      <div class="support-social-links">{{SUPPORT_VK_BTN}}</div>
      <button class="btn-primary" id="startChatBtn" onclick="startChat()">Начать чат</button>
    </div>

    <!-- chat screen (hidden initially) -->
    <div id="chatScreen" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header">
        <div class="chat-header-icon">💬</div>
        <div class="chat-header-text">
          <h2>Поддержка {{SITE_NAME}}</h2>
          <p id="agentStatusText">Ожидаем ответа...</p>
        </div>
        <div class="status-dot" id="agentDot"></div>
      </div>
      <div class="chat-messages" id="messages">
        <div class="typing-indicator" id="typingIndicator">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div id="resolvedBanner" class="resolved-banner" style="display:none">
        Тикет закрыт. Если вопрос остался, создайте новое обращение.
      </div>
      <div id="resolvedActions" class="resolved-actions">
        <button class="btn-primary" type="button" onclick="startNewTicket()">Новое обращение</button>
      </div>
      <div class="chat-input-area" id="inputArea">
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="Сообщение..." onkeydown="handleKey(event)" oninput="autoResize(this); sendTyping();"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "support_ticket_token";
    let token = localStorage.getItem(STORAGE_KEY);
    let ws = null;
    let typingTimeout = null;
    let audioCtx = null;
    let shouldReconnect = true;

    function beep(freq = 880, dur = 0.25, vol = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function formatTime(iso) {
      const d = new Date(iso + (iso.endsWith("Z") ? "" : "Z"));
      return d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
    }

    function appendMessage(msg) {
      const area = document.getElementById("messages");
      const typing = document.getElementById("typingIndicator");
      const el = document.createElement("div");
      el.className = `msg ${msg.sender}`;
      let senderLine = msg.sender === "agent" ? `<div class="msg-sender">${msg.agent_name || "Поддержка"}</div>` : "";
      el.innerHTML = `${senderLine}<div>${escapeHtml(msg.text)}</div><div class="msg-time">${formatTime(msg.created_at)}</div>`;
      area.insertBefore(el, typing);
      area.scrollTop = area.scrollHeight;
      if (msg.sender === "agent") beep(660, 0.2);
    }

    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
    }

    function showTyping(visible) {
      document.getElementById("typingIndicator").className = "typing-indicator" + (visible ? " visible" : "");
      if (visible) document.getElementById("messages").scrollTop = 9999;
    }

    function connectWS() {
      if (!token) return;
      shouldReconnect = true;
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/support/${token}`);
      ws.onmessage = e => {
        const data = JSON.parse(e.data);
        if (data.type === "message") {
          showTyping(false);
          if (data.sender === "client") return; // already shown optimistically
          appendMessage(data);
        } else if (data.type === "typing" && data.sender === "agent") {
          showTyping(true);
          clearTimeout(typingTimeout);
          typingTimeout = setTimeout(() => showTyping(false), 3000);
        } else if (data.type === "presence" && data.who === "agent") {
          const dot = document.getElementById("agentDot");
          const txt = document.getElementById("agentStatusText");
          dot.className = "status-dot" + (data.online ? " online" : "");
          txt.textContent = data.online ? "Агент онлайн" : "Ожидаем ответа...";
        } else if (data.type === "resolved") {
          showResolvedState();
        }
      };
      ws.onclose = () => {
        if (shouldReconnect && token) setTimeout(connectWS, 3000);
      };
    }

    async function loadTicket() {
      if (!token) return;
      try {
        const r = await fetch(`/api/support/ticket/${token}`);
        if (!r.ok) { localStorage.removeItem(STORAGE_KEY); token = null; return; }
        const data = await r.json();
        showChatScreen();
        const area = document.getElementById("messages");
        const typing = document.getElementById("typingIndicator");
        for (const msg of data.messages) appendMessage(msg);
        if (data.status === "resolved") {
          showResolvedState();
        } else {
          showActiveState();
        }
        connectWS();
      } catch(e) {}
    }

    function showActiveState() {
      document.getElementById("resolvedBanner").style.display = "none";
      document.getElementById("resolvedActions").style.display = "none";
      document.getElementById("inputArea").style.display = "flex";
    }

    function showResolvedState() {
      document.getElementById("resolvedBanner").style.display = "block";
      document.getElementById("resolvedActions").style.display = "block";
      document.getElementById("inputArea").style.display = "none";
    }

    function startNewTicket() {
      shouldReconnect = false;
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }
      token = null;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("newTicketScreen").style.display = "flex";
      document.getElementById("messages").innerHTML = '<div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>';
      document.getElementById("firstMsg").value = "";
      document.getElementById("chatInput").value = "";
      document.getElementById("startChatBtn").disabled = false;
      document.getElementById("startChatBtn").textContent = "Начать чат";
      showActiveState();
      setTimeout(() => document.getElementById("firstMsg").focus(), 50);
    }

    function showChatScreen() {
      document.getElementById("newTicketScreen").style.display = "none";
      const chat = document.getElementById("chatScreen");
      chat.style.display = "flex";
      document.getElementById("chatWrap").style.minHeight = "520px";
      showActiveState();
    }

    async function startChat() {
      const msgText = document.getElementById("firstMsg").value.trim();
      if (!msgText) { document.getElementById("firstMsg").focus(); return; }
      const contactVal = document.getElementById("contactInput").value.trim();
      if (!contactVal) { document.getElementById("contactInput").focus(); return; }
      const btn = document.getElementById("startChatBtn");
      btn.disabled = true;
      btn.textContent = "Отправляем...";
      try {
        const r = await fetch("/api/support/new-ticket", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            message: msgText,
            contact: document.getElementById("contactInput").value.trim() || null,
            messenger: document.getElementById("messengerInput").value || null,
          })
        });
        const data = await r.json();
        if (data.token) {
          token = data.token;
          localStorage.setItem(STORAGE_KEY, token);
          showChatScreen();
          appendMessage({sender:"client", text:msgText, created_at: new Date().toISOString(), agent_name:null});
          connectWS();
        }
      } catch(e) {
        btn.disabled = false; btn.textContent = "Начать чат";
      }
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text || !token) return;
      input.value = ""; autoResize(input);
      appendMessage({sender:"client", text, created_at: new Date().toISOString(), agent_name:null});
      try {
        await fetch(`/api/support/ticket/${token}/message`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({text})
        });
      } catch(e) {}
    }

    function sendTyping() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: "typing"}));
      }
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 120) + "px";
    }

    // Init
    if (window.top !== window.self) {
      document.body.classList.add("iframe-mode");
    }
    if (token) { loadTicket(); }
    // unlock AudioContext on first interaction
    document.addEventListener("click", () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, {once: true});
  </script>
</body>
</html>
