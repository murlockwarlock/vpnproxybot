<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Darimiru — подтверждение</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #fff8ef, #f2eadf); color: #12212b; font: 16px "Manrope", "Segoe UI", sans-serif; }
    main { box-sizing: border-box; width: min(460px, calc(100% - 32px)); margin: 8vh auto; padding: 24px; background: rgba(255, 250, 243, .86); border: 1px solid rgba(18, 33, 43, .12); border-radius: 28px; box-shadow: 0 18px 44px rgba(20, 44, 54, .14); }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
    input, button { box-sizing: border-box; width: 100%; margin: 8px 0; padding: 14px; border-radius: 12px; border: 1px solid rgba(18, 33, 43, .12); font: inherit; }
    button { background: linear-gradient(135deg, #0c8c8c, #0f5e63); color: white; cursor: pointer; }
    a { color: #0f5e63; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Подтверждение email</h1>
  <form id="form">
    <input id="password" type="password" placeholder="Новый пароль от 8 знаков" autocomplete="new-password" minlength="8" hidden>
    <button id="submit" type="submit">Подтвердить</button>
  </form>
  <p id="message" role="status"></p>
  <a href="/profile">Вернуться ко входу</a>
</main>
<script>
  const reset = {{RESET}};
  const token = location.hash.slice(1);
  history.replaceState(null, "", location.pathname);
  if (reset) {
    document.getElementById("title").textContent = "Новый пароль";
    document.getElementById("password").hidden = false;
    document.getElementById("password").required = true;
    document.getElementById("submit").textContent = "Сохранить пароль";
  }
  document.getElementById("form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    try {
      const response = await fetch(`/api/store/auth/${reset ? "reset" : "confirm"}`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({token, password: document.getElementById("password").value})
      });
      const data = await response.json();
      document.getElementById("message").textContent = response.ok ? "Готово. Теперь можно войти в профиль." : data.error;
      if (response.ok) document.getElementById("form").hidden = true;
    } catch { document.getElementById("message").textContent = "Ошибка сети. Попробуйте ещё раз."; }
    button.disabled = false;
  });
</script>
</body>
</html>
