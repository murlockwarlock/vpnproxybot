server {
    server_name vpn.psysoldatov.ru;

    location = /connect {
        return 302 /connect/;
    }

    location ^~ /connect/ {
        root /var/www/internet-accelerator;
        try_files /connect.html =404;
        add_header Cache-Control "no-store";
    }

    location ~ ^/sub/(?<sub_token>[A-Za-z0-9=_-]+)$ {
        if ($http_accept ~* "text/html") {
            return 302 /connect/$sub_token;
        }

        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 8443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vpn.psysoldatov.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vpn.psysoldatov.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = vpn.psysoldatov.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 8080;
    server_name vpn.psysoldatov.ru;
    return 404; # managed by Certbot
}
