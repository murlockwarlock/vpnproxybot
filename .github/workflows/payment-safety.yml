name: Payment Safety & Critical Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-mock

      - name: Run payment safety static check
        run: |
          python scripts/check_payments_safety.py

      - name: Run critical payment acceptance suite
        run: |
          pytest tests/test_payment_recovery_acceptance.py -v
