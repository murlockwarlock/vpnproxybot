name: Payment Safety & Critical Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-mock

      - name: Run payment safety static check
        run: |
          python scripts/check_payments_safety.py

      - name: Run critical payment acceptance suite
        run: |
          pytest tests/test_payment_recovery_acceptance.py -v

      - name: Run admin payment logs regressions
        run: |
          pytest -q tests/test_admin_payment_logs.py tests/test_payment_logger.py tests/test_admin_stats.py

      - name: Run manual Adapt admin alert regressions
        run: |
          pytest -q tests/test_admin_adapt_demo_and_keys.py -k manual_adapt_failure
          pytest -q tests/test_adapt_subscription_service.py -k adapt_upgrade_failure_preserves_safe_operation_classification

      - name: Run admin client search link regressions
        run: |
          pytest -v tests/test_admin_client_search_links.py

      - name: Run Adapt unpaid traffic callback guard regressions
        run: |
          pytest -v tests/test_adapt_traffic_callback_guard.py
          pytest -v tests/test_adapt_api.py -k "not test_disabled_raises_on_post"

      - name: Run VHQ renew safety & recovery regressions
        run: |
          pytest -q tests/test_vhq_renew_fulfillment.py tests/test_vhq_problem_payment_recovery.py

      - name: Run Webstore profile auth & IDOR security regressions
        run: |
          PYTHONPATH=tests:. pytest -v tests/test_webstore_session_security.py tests/test_webstore_email_auth.py tests/test_webstore_otp_auth.py tests/test_webstore_telegram_auth.py tests/test_support_account_recovery.py
