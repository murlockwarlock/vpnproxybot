server {
    listen 80;
    server_name loonapie.xyz www.loonapie.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8444 ssl http2;
    server_name loonapie.xyz www.loonapie.xyz;

    ssl_certificate /etc/letsencrypt/live/loonapie.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loonapie.xyz/privkey.pem;

    client_max_body_size 32m;

    location ~ ^/sub/([^/?#]+)$ {
        set $sub_token $1;
        proxy_pass http://127.0.0.1:7000/sub/$sub_token$is_args$args;
        proxy_set_header Host vpn.psysoldatov.ru:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header subscription-userinfo;
        add_header profile-title "Ускоритель интернета" always;
        add_header support-url "https://t.me/loonapie_support" always;
    }

    location ~ ^/s/([^/?#]+)$ {
        set $sub_token $1;
        proxy_pass http://127.0.0.1:7000/sub/$sub_token$is_args$args;
        proxy_set_header Host vpn.psysoldatov.ru:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header subscription-userinfo;
        add_header profile-title "Ускоритель интернета" always;
        add_header support-url "https://t.me/loonapie_support" always;
    }

    location = /pay/webhook {
        proxy_pass http://webstore:8901/pay/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /vpnbot/ {
        proxy_pass http://bot:8081/vpnbot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://webstore:8901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
