map $ssl_preread_server_name $xray_backend {
    default 127.0.0.1:2053;

    # Web/API domains.
    loonapie.xyz 127.0.0.1:8444;
    www.loonapie.xyz 127.0.0.1:8444;
    vpn.psysoldatov.ru 127.0.0.1:8443;

    # Reality/SNI bridge ports. The exact inbound settings are restored from
    # /var/lib/marzban/xray_config.json in the backup bundle.
    ads.x5.ru 127.0.0.1:2053;
    api-maps.yandex.ru 127.0.0.1:2054;
    eh1.vk.com 127.0.0.1:2055;
    smartcaptcha.yandexcloud.net 127.0.0.1:2056;
    io.ozone.ru 127.0.0.1:2057;
}

server {
    listen 443 reuseport;
    proxy_pass $xray_backend;
    ssl_preread on;
}
